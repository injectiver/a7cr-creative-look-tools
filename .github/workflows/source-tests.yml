name: Source and publication checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-research.txt
      - run: python a7cr.py bootstrap --research
      - run: python tools/run_tests.py
      - name: Offline source tests
        env:
          PYTHONPATH: .:device:offline
        run: >-
          python -m unittest test_single_slot_candidate
          test_prepare_single_slot_installation test_portrait_slots_candidate
          test_prepare_portrait_slots_installation test_portrait_slots_runtime
      - run: python tools/audit_publication.py
